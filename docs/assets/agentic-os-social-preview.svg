<!--
Source social-preview asset for Agentic OS repository homes.
Export this SVG to a bitmap only when a hosting surface requires PNG/JPG upload.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Agentic OS portable agent framework</title>
  <desc id="desc">A visual map showing doctrine, loop, primitives, runtime, and validation gates.</desc>
  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect x="64" y="54" width="1072" height="522" rx="28" fill="#111827"/>
  <rect x="94" y="84" width="1012" height="462" rx="20" fill="#f9fafb"/>

  <text x="136" y="168" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="72" font-weight="800">Agentic OS</text>
  <text x="139" y="216" fill="#374151" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="30" font-weight="500">Portable framework for building, coordinating, and validating AI agents</text>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="700">
    <rect x="138" y="292" width="174" height="92" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <text x="174" y="346" fill="#1e3a8a">Doctrine</text>

    <rect x="364" y="292" width="174" height="92" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <text x="421" y="346" fill="#166534">Loop</text>

    <rect x="590" y="292" width="174" height="92" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
    <text x="621" y="346" fill="#92400e">Primitives</text>

    <rect x="816" y="292" width="174" height="92" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
    <text x="862" y="346" fill="#4c1d95">Runtime</text>
  </g>

  <g stroke="#4b5563" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M312 338 H364"/>
    <path d="M538 338 H590"/>
    <path d="M764 338 H816"/>
    <path d="M903 384 V426 H225 V384"/>
  </g>

  <rect x="338" y="426" width="524" height="70" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="3"/>
  <text x="390" y="472" fill="#155e75" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="27" font-weight="800">Validators keep the boundary honest</text>

  <text x="139" y="530" fill="#4b5563" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="600">Schemas, standards, roles, skills, coordination, and zone-purity in one extraction-ready tree</text>
</svg>

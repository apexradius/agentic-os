# framework-validate — the framework dogfooding its own gate.
#
# This tree ships a `ci/` standard full of reusable workflows for *consumer* repos, and a
# one-command harness that enforces every other standard. This workflow closes the loop: it
# runs that harness on the framework's OWN pull requests, so the repo that preaches CI gates
# is itself gated by them. A consumer who extracts this tree inherits a working CI starter.
#
# Paths are relative to the repository root — in the published framework, this tree *is* the
# root, so the harness sits at `primitives/_lib/validate.mjs`. The standards-as-code gates and the
# zone-purity tripwire are zero-dependency; the umbrella harness parses YAML frontmatter and
# JSON-Schema-validates primitives, so it needs its `_lib` toolchain (ajv, yaml) — hence the
# `npm ci` step before it runs.
name: framework-validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install harness toolchain (ajv, yaml)
        working-directory: primitives/_lib
        run: npm ci
      - name: Standards + primitive harness
        run: node primitives/_lib/validate.mjs --all
      - name: Zone-purity tripwire (zero-dependency)
        run: bash runtime/verify-zone-purity.sh

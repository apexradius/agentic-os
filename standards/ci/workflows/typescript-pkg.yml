name: TypeScript Package CI (reusable)

on:
  workflow_call:
    inputs:
      runs-on:
        type: string
        default: ubuntu-latest
      node-version:
        type: string
        default: '20'
      working-directory:
        type: string
        default: '.'
      package-manager:
        type: string
        default: npm
        description: npm | pnpm | yarn — matches lockfile.
      linter:
        type: string
        default: biome
        description: biome | eslint — Biome is the default. Switch to eslint for repos that use it via a shared ESLint config.
      run-typecheck:
        type: boolean
        default: true
      run-build:
        type: boolean
        default: true
      run-tests:
        type: boolean
        default: true
      secrets-scan:
        type: boolean
        default: true
      run-semgrep:
        type: boolean
        default: false
        description: Run Semgrep SAST (TS/JS rules + security-audit). Opt-in until baseline is clean.
      run-dep-audit:
        type: boolean
        default: false
        description: Run `<pm> audit` (matches package-manager input). Opt-in.
      dep-audit-level:
        type: string
        default: high
        description: Block on high+critical by default. Values low | moderate | high | critical.

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  validate:
    name: Lint + Typecheck + Build + Test
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        if: inputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
          cache-dependency-path: ${{ inputs.working-directory }}/${{ inputs.package-manager == 'pnpm' && 'pnpm-lock.yaml' || (inputs.package-manager == 'yarn' && 'yarn.lock' || 'package-lock.json') }}

      - name: Install
        run: |
          case "${{ inputs.package-manager }}" in
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --frozen-lockfile ;;
            *) npm ci ;;
          esac

      - name: Setup Biome
        if: inputs.linter == 'biome'
        uses: biomejs/setup-biome@v2
        with:
          version: latest

      - name: Lint (Biome)
        if: inputs.linter == 'biome'
        run: biome ci .

      - name: Lint (script-defined, eslint or other)
        if: inputs.linter == 'eslint'
        run: |
          case "${{ inputs.package-manager }}" in
            pnpm) pnpm run lint ;;
            yarn) yarn lint ;;
            *) npm run lint ;;
          esac

      - name: Typecheck
        if: ${{ inputs.run-typecheck }}
        run: |
          case "${{ inputs.package-manager }}" in
            pnpm) pnpm exec tsc --noEmit ;;
            yarn) yarn tsc --noEmit ;;
            *) npx tsc --noEmit ;;
          esac

      - name: Build
        if: ${{ inputs.run-build }}
        run: |
          case "${{ inputs.package-manager }}" in
            pnpm) pnpm run build ;;
            yarn) yarn build ;;
            *) npm run build ;;
          esac

      - name: Test
        if: ${{ inputs.run-tests }}
        run: |
          case "${{ inputs.package-manager }}" in
            pnpm) pnpm test --if-present ;;
            yarn) yarn test --if-present ;;
            *) npm test --if-present ;;
          esac

  secrets-scan:
    if: ${{ inputs.secrets-scan }}
    uses: ./.github/workflows/gitleaks.yml
    with:
      runs-on: ${{ inputs.runs-on }}

  semgrep-sast:
    if: ${{ inputs.run-semgrep }}
    uses: ./.github/workflows/semgrep.yml
    with:
      runs-on: ${{ inputs.runs-on }}
      configs: 'p/security-audit p/typescript p/javascript'
      excludes: 'node_modules,dist,build,.next,coverage'

  dep-audit:
    if: ${{ inputs.run-dep-audit }}
    uses: ./.github/workflows/dep-audit.yml
    with:
      runs-on: ${{ inputs.runs-on }}
      language: ${{ inputs.package-manager }}
      audit-level: ${{ inputs.dep-audit-level }}
      node-version: ${{ inputs.node-version }}
      working-directory: ${{ inputs.working-directory }}

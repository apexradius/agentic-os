name: Fleet Policy Drift Check (reusable)

on:
  workflow_call:
    inputs:
      runs-on:
        type: string
        default: ubuntu-latest
      python-version:
        type: string
        default: '3.12'
      fleet-directory:
        type: string
        default: 'fleet'
        description: Directory containing stage_allow.py and machines.json.

permissions:
  contents: read
  pull-requests: read

jobs:
  stage-allow-check:
    name: stage_allow.py --check
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 5
    defaults:
      run:
        working-directory: ${{ inputs.fleet-directory }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Check generated fleet policies
        run: |
          set -euo pipefail
          identities="$(python3 -c 'import json; from pathlib import Path; data = json.loads(Path("machines.json").read_text(encoding="utf-8")); print(" ".join(sorted(data["runner_identities"])))')"

          status=0
          for identity in $identities; do
            echo "CHECK ${identity}"
            if ! python3 stage_allow.py "$identity" --check; then
              status=1
            fi
          done

          exit "$status"
